name: verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Core tests
        run: npm run test:core
      - name: Build library and Electron app
        run: npm run build
      - name: Build reproducible verification image
        run: docker build --tag electron-state-bridge:ci .
      - name: Real Electron IPC integration
        run: npm run test:electron:built
      - name: Bounded synchronous IPC benchmark
        run: |
          set -o pipefail
          npm run benchmark:sync:built | tee sync-benchmark.txt
      - name: Preserve evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-evidence
          path: |
            sync-benchmark.txt
            package-lock.json
          if-no-files-found: warn
